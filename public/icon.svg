<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" stroke="#0e7490" stroke-width="4" />

  <!-- Outer Radar Crosshairs -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <line x1="256" y1="36" x2="256" y2="476" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="36" y1="256" x2="476" y2="256" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Outer Diamond (Tesseract Outer Frame) -->
  <polygon points="256,96 416,256 256,416 96,256" fill="none" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Inner Square (Tesseract Inner Cell) -->
  <polygon points="200,200 312,200 312,312 200,312" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="3.5" opacity="0.9" />

  <!-- Projection Struts (4D Hypercube Rotational Axes) -->
  <line x1="256" y1="96" x2="256" y2="200" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="416" y1="256" x2="312" y2="256" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="256" y1="416" x2="256" y2="312" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="96" y1="256" x2="200" y2="256" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Corner Diagonal Struts -->
  <line x1="176" y1="176" x2="200" y2="200" stroke="#818cf8" stroke-width="2" />
  <line x1="336" y1="176" x2="312" y2="200" stroke="#818cf8" stroke-width="2" />
  <line x1="336" y1="336" x2="312" y2="312" stroke="#818cf8" stroke-width="2" />
  <line x1="176" y1="336" x2="200" y2="312" stroke="#818cf8" stroke-width="2" />

  <!-- Central Quantum Entanglement Core -->
  <circle cx="256" cy="256" r="32" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- Outer Vertex Indicator Pings -->
  <circle cx="256" cy="96" r="5" fill="#38bdf8" />
  <circle cx="416" cy="256" r="5" fill="#38bdf8" />
  <circle cx="256" cy="416" r="5" fill="#38bdf8" />
  <circle cx="96" cy="256" r="5" fill="#38bdf8" />
</svg>
